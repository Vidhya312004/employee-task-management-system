<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Admin Registration</h2>
      <p>Create a new admin account to manage the system.</p>
    </div>
    
    <div *ngIf="errorMessage" class="error-alert">
      {{ errorMessage }}
    </div>
    
    <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input 
          type="text" 
          id="name" 
          name="name"
          class="form-control" 
          [(ngModel)]="userData.name" 
          required 
          placeholder="John Doe">
      </div>
      
      <div class="form-group">
        <label for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email"
          class="form-control" 
          [(ngModel)]="userData.email" 
          required 
          placeholder="admin@example.com">
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password"
          class="form-control" 
          [(ngModel)]="userData.password" 
          required 
          placeholder="Create a strong password"
          minlength="6">
      </div>
      
      <button type="submit" class="btn btn-primary btn-block" [disabled]="isLoading || !registerForm.form.valid">
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        {{ isLoading ? 'Registering...' : 'Register' }}
      </button>
    </form>
    
    <div class="auth-footer">
      <p>Already have an admin account? <a routerLink="/admin/login">Login here</a></p>
    </div>
  </div>
</div>
