<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Welcome</h2>
      <p>Sign in </p>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="admin@example.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="••••••••" required>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        <span class="material-symbols-rounded">error</span>
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading">
        <span *ngIf="!isLoading">Sign In</span>
        <span *ngIf="isLoading" class="loader"></span>
      </button>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #697386;">
        <p>Don't have an account? <a routerLink="/register"
            style="color: #635bff; text-decoration: none; font-weight: 600;">Register here</a></p>
      </div>
    </form>
  </div>
</div>
